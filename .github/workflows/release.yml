name: Release packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Existing release tag to retry publishing (for example v0.2.0); empty runs Release Please only'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
  wiki:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
    uses: ./.github/workflows/sync-wiki.yml
    with:
      tag: ${{ inputs.publish_tag || needs.release.outputs.tag_name }}
    permissions:
      contents: write
  publish:
    name: Publish to ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: npmjs
            registry: https://registry.npmjs.org
          - target: GitHub Packages
            registry: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag || needs.release.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: ${{ matrix.registry }}
          scope: '@kieksme'
      - run: pnpm install --frozen-lockfile
      # Older release tags may still lint the generated changelog.
      - name: Normalize generated release notes
        run: pnpm exec prettier --write CHANGELOG.md --ignore-path /dev/null
      - run: pnpm check && pnpm test:packages
      - name: Check npm publishing credentials
        if: matrix.target == 'npmjs'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Set NPM_AUTH_TOKEN with write access to the npm organization @kieksme (including creation of new packages).'
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
      # publishConfig.registry takes precedence over CLI registry options.
      # Set it only after validation so both jobs publish to their own registry.
      - name: Select publishing registry
        env:
          PUBLISH_REGISTRY: ${{ matrix.registry }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          for (const directory of await readdir('packages')) {
            const path = `packages/${directory}/package.json`;
            const pkg = JSON.parse(await readFile(path, 'utf8'));
            if (pkg.private || !/^@kieksme\/csp-[a-z0-9]+(?:-[a-z0-9]+)*$/.test(pkg.name)) {
              throw new Error(`Invalid publishing package: ${pkg.name}`);
            }
            pkg.publishConfig = { ...pkg.publishConfig, registry: process.env.PUBLISH_REGISTRY, access: 'public' };
            pkg.repository = { ...pkg.repository, type: 'git', url: `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git` };
            await writeFile(path, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE
      - name: Publish to npmjs
        if: matrix.target == 'npmjs'
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - name: Publish to GitHub Packages
        if: matrix.target == 'GitHub Packages'
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Link published packages in release notes
        if: matrix.target == 'npmjs'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.publish_tag || needs.release.outputs.tag_name }}
        with:
          script: |
            const { readFile, readdir } = require('node:fs/promises');
            const links = [];
            for (const entry of await readdir('packages', { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const pkg = JSON.parse(await readFile(`packages/${entry.name}/package.json`, 'utf8'));
              if (pkg.private) continue;
              links.push(`- [${pkg.name}@${pkg.version}](https://www.npmjs.com/package/${pkg.name}/v/${pkg.version})`);
            }
            links.sort();
            const start = '<!-- npm-packages:start -->';
            const end = '<!-- npm-packages:end -->';
            const section = `${start}\n## npm-Packages\n\n${links.join('\n')}\n${end}`;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = release.body || '';
            const previous = /<!-- npm-packages:start -->[\s\S]*?<!-- npm-packages:end -->/;
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              body: previous.test(body)
                ? body.replace(previous, () => section)
                : `${body.trimEnd()}\n\n${section}`,
            });
