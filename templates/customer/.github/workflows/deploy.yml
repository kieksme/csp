name: Customer portal
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  portal:
    # Select a reviewed CSP revision containing customer-build.yml before enabling CI.
    uses: kieksme/csp/.github/workflows/customer-build.yml@main
    with:
      config: portal.config.json
      pages: false
